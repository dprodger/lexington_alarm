<!-- wp:html -->
<!-- CUSTOM NEWS PAGE LAYOUT -->
<div class="news-page-wrapper">
    
    <!-- FEATURED STORY -->
    <div class="featured-story-section">
        <h2 class="section-title">FEATURED STORY</h2>
        [featured_story]
    </div>
    
    <!-- SUBSCRIBE BANNER -->
    <div class="subscribe-banner">
        <h2>STAY INFORMED</h2>
        <p>Get the latest updates delivered to your inbox</p>
        <a href="/get-involved" class="la-button-large">SUBSCRIBE TO NEWSLETTER</a>
    </div>
    
    <!-- RECENT POSTS -->
    <div class="blog-posts-section">
        <h2 class="section-title" style="color: #044f9d;">RECENT NEWS</h2>
        [blog_posts_grid]
    </div>
    
    <!-- NEWSLETTER ARCHIVE (if you want it) -->
    <div class="newsletter-archive-section">
        <h2 class="section-title">NEWSLETTER ARCHIVE</h2>
        [newsletter_archive]
    </div>
    
</div>
<!-- /wp:html -->
