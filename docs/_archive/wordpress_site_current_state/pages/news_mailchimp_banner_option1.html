<!-- STYLED MAILCHIMP SUBSCRIBE BANNER FOR NEWS PAGE -->

<!-- Replace your current subscribe banner HTML with this: -->

<div class="subscribe-banner" style="background: linear-gradient(135deg, #044f9d 0%, #0367c7 100%); 
     color: white; padding: 50px 30px; text-align: center; margin: 40px 0; 
     border: 4px solid #c3202e; position: relative; overflow: hidden;">
    
    <!-- Decorative corners -->
    <div style="position: absolute; top: 0; left: 0; width: 60px; height: 60px; 
         border-top: 3px solid white; border-left: 3px solid white;"></div>
    <div style="position: absolute; top: 0; right: 0; width: 60px; height: 60px; 
         border-top: 3px solid white; border-right: 3px solid white;"></div>
    <div style="position: absolute; bottom: 0; left: 0; width: 60px; height: 60px; 
         border-bottom: 3px solid white; border-left: 3px solid white;"></div>
    <div style="position: absolute; bottom: 0; right: 0; width: 60px; height: 60px; 
         border-bottom: 3px solid white; border-right: 3px solid white;"></div>
    
    <div style="position: relative; z-index: 1; max-width: 600px; margin: 0 auto;">
        <h2 style="color: white; font-family: 'ArmaliteRifle', sans-serif; 
             font-size: 2.5em; text-transform: uppercase; margin-bottom: 15px; 
             text-shadow: 2px 2px 4px rgba(0,0,0,0.3);">
            STAY INFORMED
        </h2>
        
        <p style="font-size: 1.2em; margin-bottom: 30px; line-height: 1.6;">
            Join the Lexington Alarm Network for event updates, 
            250th anniversary news, and calls to action when democracy needs defending.
        </p>
        
        <!-- MC4WP FORM - Replace [mc4wp_form id="123"] with your actual form ID -->
        <div class="mailchimp-form-wrapper" style="background: white; padding: 25px; 
             border-radius: 8px; box-shadow: 0 4px 15px rgba(0,0,0,0.2);">
            
            [mc4wp_form id="YOUR_FORM_ID_HERE"]
            
        </div>
        
        <p style="font-size: 0.85em; margin-top: 20px; opacity: 0.9;">
            📧 Typically 2-4 emails per month • Unsubscribe anytime • We never share your info
        </p>
    </div>
</div>

<style>
/* Style the MC4WP form to match Lexington Alarm branding */
.subscribe-banner .mc4wp-form {
    text-align: left;
}

.subscribe-banner .mc4wp-form-fields {
    display: flex;
    gap: 10px;
    flex-wrap: wrap;
    justify-content: center;
}

.subscribe-banner .mc4wp-form input[type="email"] {
    flex: 1;
    min-width: 250px;
    padding: 15px 20px;
    font-size: 16px;
    border: 2px solid #044f9d;
    border-radius: 4px;
    font-family: 'Work Sans', sans-serif;
}

.subscribe-banner .mc4wp-form input[type="submit"] {
    padding: 15px 40px;
    background: #c3202e;
    color: white;
    border: 2px solid #c3202e;
    font-size: 18px;
    font-weight: bold;
    font-family: 'UglyQua', sans-serif;
    text-transform: uppercase;
    cursor: pointer;
    border-radius: 4px;
    transition: all 0.3s ease;
}

.subscribe-banner .mc4wp-form input[type="submit"]:hover {
    background: #a01a24;
    border-color: #a01a24;
    transform: translateY(-2px);
    box-shadow: 0 4px 8px rgba(0,0,0,0.2);
}

.subscribe-banner .mc4wp-response {
    margin-top: 15px;
    padding: 12px;
    border-radius: 4px;
    font-weight: bold;
    text-align: center;
}

.subscribe-banner .mc4wp-success {
    background: #d4edda;
    color: #155724;
    border: 2px solid #28a745;
}

.subscribe-banner .mc4wp-error {
    background: #f8d7da;
    color: #721c24;
    border: 2px solid #dc3545;
}

/* Mobile responsive */
@media (max-width: 768px) {
    .subscribe-banner {
        padding: 30px 15px;
    }
    
    .subscribe-banner h2 {
        font-size: 1.8em !important;
    }
    
    .subscribe-banner p {
        font-size: 1em !important;
    }
    
    .subscribe-banner .mc4wp-form-fields {
        flex-direction: column;
    }
    
    .subscribe-banner .mc4wp-form input[type="email"],
    .subscribe-banner .mc4wp-form input[type="submit"] {
        width: 100%;
        min-width: auto;
    }
}
</style>

<!-- 
SETUP INSTRUCTIONS:

1. In WordPress Admin, go to: Mailchimp for WP → Forms
2. Either edit your existing form or create a new one
3. Note the Form ID number (shown in the list)
4. Replace "YOUR_FORM_ID_HERE" above with your actual form ID
5. The form fields should just be:
   - Email input
   - Submit button
   
RECOMMENDED MC4WP FORM SETUP:

In the form editor, use this simple code:

<label>Email Address</label>
{email_field}
{submit_button}

This keeps it minimal and clean. The CSS above will style it beautifully!
-->
