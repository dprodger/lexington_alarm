<!-- Enhanced Front-End Editor with Rich Text -->
<!-- Add this as a separate page template or enhance the PHP snippet -->

<!DOCTYPE html>
<html>
<head>
    <title>Lexington Alarm - News Submission Portal</title>
    <style>
        body {
            font-family: 'Work Sans', Arial, sans-serif;
            max-width: 900px;
            margin: 0 auto;
            padding: 20px;
            background: #f5f5f5;
        }
        
        .news-portal-header {
            background: #044f9d;
            color: white;
            padding: 20px;
            margin: -20px -20px 30px -20px;
        }
        
        .news-portal-header h1 {
            margin: 0;
            font-family: 'ArmaliteRifle', sans-serif;
            text-transform: uppercase;
        }
        
        .editor-toolbar {
            background: #fff;
            border: 2px solid #044f9d;
            padding: 10px;
            margin-bottom: 0;
        }
        
        .editor-btn {
            background: #f0f0f0;
            border: 1px solid #ccc;
            padding: 5px 10px;
            margin: 2px;
            cursor: pointer;
            font-size: 14px;
        }
        
        .editor-btn:hover {
            background: #044f9d;
            color: white;
        }
        
        .content-editor {
            min-height: 400px;
            padding: 15px;
            border: 2px solid #044f9d;
            border-top: none;
            background: white;
            font-size: 16px;
            line-height: 1.6;
        }
        
        .submit-section {
            margin-top: 20px;
            padding: 20px;
            background: white;
            border: 2px solid #c3202e;
        }
        
        .preview-pane {
            margin-top: 20px;
            padding: 20px;
            background: white;
            border: 2px solid #044f9d;
            display: none;
        }
        
        .status-message {
            padding: 15px;
            margin: 20px 0;
            border-radius: 5px;
        }
        
        .success {
            background: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }
        
        .error {
            background: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }
    </style>
</head>
<body>

<div class="news-portal-header">
    <h1>Lexington Alarm News Portal</h1>
    <p>Submit and manage news stories</p>
</div>

<!-- Login Section (if not logged in) -->
<div id="login-section">
    <h2>News Team Login</h2>
    <form id="login-form">
        <input type="text" placeholder="Username" id="username" required>
        <input type="password" placeholder="Password" id="password" required>
        <button type="submit">Login</button>
    </form>
</div>

<!-- Editor Section (if logged in) -->
<div id="editor-section" style="display: none;">
    
    <div class="editor-toolbar">
        <button class="editor-btn" onclick="formatText('bold')"><b>B</b></button>
        <button class="editor-btn" onclick="formatText('italic')"><i>I</i></button>
        <button class="editor-btn" onclick="formatText('underline')"><u>U</u></button>
        <button class="editor-btn" onclick="formatText('insertUnorderedList')">• List</button>
        <button class="editor-btn" onclick="formatText('insertOrderedList')">1. List</button>
        <button class="editor-btn" onclick="insertLink()">🔗 Link</button>
        <button class="editor-btn" onclick="formatText('undo')">↶ Undo</button>
        <button class="editor-btn" onclick="formatText('redo')">↷ Redo</button>
        <button class="editor-btn" onclick="togglePreview()">👁 Preview</button>
    </div>
    
    <div class="content-editor" contenteditable="true" id="story-content">
        Start typing your news story here...
    </div>
    
    <div class="submit-section">
        <h3>Publishing Options</h3>
        <label>
            <input type="checkbox" id="featured"> 
            Feature this story (appears at top of news page)
        </label>
        <br><br>
        <button onclick="saveDraft()" style="background: #6c757d; color: white; padding: 10px 20px; border: none; cursor: pointer;">
            Save Draft
        </button>
        <button onclick="submitForReview()" style="background: #044f9d; color: white; padding: 10px 20px; border: none; cursor: pointer;">
            Submit for Review
        </button>
        <button onclick="publishNow()" style="background: #c3202e; color: white; padding: 10px 20px; border: none; cursor: pointer;">
            Publish Now
        </button>
    </div>
    
    <div class="preview-pane" id="preview-pane">
        <h3>Preview</h3>
        <div id="preview-content"></div>
    </div>
    
</div>

<script>
function formatText(command) {
    document.execCommand(command, false, null);
    document.getElementById('story-content').focus();
}

function insertLink() {
    const url = prompt('Enter URL:');
    if (url) {
        document.execCommand('createLink', false, url);
    }
}

function togglePreview() {
    const preview = document.getElementById('preview-pane');
    const content = document.getElementById('story-content').innerHTML;
    
    if (preview.style.display === 'none') {
        preview.style.display = 'block';
        document.getElementById('preview-content').innerHTML = content;
    } else {
        preview.style.display = 'none';
    }
}

function saveDraft() {
    const content = document.getElementById('story-content').innerHTML;
    // Save to WordPress via AJAX
    alert('Draft saved!');
}

function submitForReview() {
    const content = document.getElementById('story-content').innerHTML;
    // Submit to WordPress as pending
    alert('Submitted for editorial review!');
}

function publishNow() {
    if (confirm('Are you sure you want to publish this story?')) {
        const content = document.getElementById('story-content').innerHTML;
        // Publish to WordPress
        alert('Story published!');
    }
}
</script>

</body>
</html>
