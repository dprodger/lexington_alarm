# nginx reverse proxy for campaign_tooling.
#
# Install to /etc/nginx/sites-available/campaign-tooling (Debian/Ubuntu) or
# /etc/nginx/conf.d/campaign-tooling.conf (RHEL family), then run certbot —
# it rewrites this block to add the TLS listener on 443 and a 301 redirect
# from 80. See deploy/README.md.
#
# Replace REPLACE_WITH_YOUR_DOMAIN before installing.

server {
    listen 80;
    listen [::]:80;
    server_name REPLACE_WITH_YOUR_DOMAIN;

    # Keep the health probe out of the access log.
    location = /healthz {
        proxy_pass http://127.0.0.1:8000/healthz;
        access_log off;
    }

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;
    }

    # Reasonable upload ceiling; bump if you add large file uploads.
    client_max_body_size 10M;
}
