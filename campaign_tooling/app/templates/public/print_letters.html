<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>{{ campaign.name }} — letters to {{ target.name }}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
  <style>
    body { background: white; }
    .page { max-width: 6.5in; margin: 0.5in auto; padding: 0; }
    .toolbar { margin-bottom: 1rem; display: flex; gap: 0.5rem; flex-wrap: wrap; }
    .letter-page { page-break-after: always; padding: 0.5in 0; }
    .letter-page:last-child { page-break-after: auto; }
    .recipient-label { color: #666; font-size: 0.85em; margin-bottom: 0.5rem; }
    @media print {
      .toolbar, #toast, .recipient-label { display: none !important; }
      .page { margin: 0; max-width: none; }
      .letter-page { padding: 0; }
    }
  </style>
</head>
<body>
  <div class="page">
    <div class="toolbar no-print">
      <button type="button" onclick="window.print()">Print all letters</button>
      <a class="button secondary" target="_blank"
         href="{{ url_for('public.letters_pdf', slug=campaign.slug, target_id=target.id, artifact_id=artifact.id) }}{% if request.query_string %}?{{ request.query_string.decode() }}{% endif %}">
        Download as PDF
      </a>
      <a class="button secondary" href="javascript:history.back()">Back</a>
    </div>

    {% for letter in letters %}
      <div class="letter-page">
        <div class="recipient-label">Letter {{ loop.index }} of {{ letters|length }} — to {{ letter.recipient.formal_name }}</div>
        <pre class="letter" style="border: none; padding: 0;">{{ letter.body_html|safe }}</pre>
      </div>
    {% endfor %}
  </div>

  <div id="toast" role="status" aria-live="polite" hidden></div>
  <script>
    (function () {
      var toastTimer = null;
      window.showToast = function (message, ms) {
        ms = ms || 5000;
        var el = document.getElementById("toast");
        if (!el) return;
        el.textContent = message;
        el.hidden = false;
        void el.offsetWidth;
        el.classList.add("toast--visible");
        if (toastTimer) clearTimeout(toastTimer);
        toastTimer = setTimeout(function () {
          el.classList.remove("toast--visible");
          setTimeout(function () { el.hidden = true; }, 250);
        }, ms);
      };
    })();
  </script>
</body>
</html>
